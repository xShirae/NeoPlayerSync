plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The jar compiles against the oldest line and runs on all of them. -Pmc=26.2 or -Pmc=26.3 runs the server and tests on a newer one.
def neoVersions = ['26.1': '26.1.2.114', '26.2': '26.2.0.88', '26.3': '26.3.0.99']
def mc = providers.gradleProperty('mc').getOrElse('26.1')
def neo = neoVersions[mc]
if (neo == null) throw new GradleException("Unknown -Pmc=${mc}. Use one of ${neoVersions.keySet()}.")

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
kotlin.jvmToolchain(25)

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    implementation "org.postgresql:postgresql:${postgresql_version}"
    jarJar "org.postgresql:postgresql:${postgresql_version}"

    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${kotlin_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

neoForge {
    version = neo

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            if (providers.gradleProperty('includeGameTests').isPresent()) sourceSet sourceSets.test
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file("run/${mc}")
        }
        if (providers.gradleProperty('includeGameTests').isPresent()) {
            // Each line keeps its own world, because an older game cannot load a world a newer one saved.
            gameTestServer {
                type = 'gameTestServer'
                sourceSet = sourceSets.test
                gameDirectory = file("build/game-test/${mc}/server")
                programArgument '--tests'
                programArgument "${mod_id}:*"
                programArgument '--report'
                programArgument file("build/game-test/${mc}/report.xml").absolutePath
                programArgument '--universe'
                programArgument file("build/game-test/${mc}/universe").absolutePath
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            loader_version_range   : loader_version_range,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_version            : version,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from('LICENSE')
}
