#Store players in Postgres so they can move between servers. false uses local files and ignores the settings below.
enabled = false
#Address of the Postgres server.
host = "127.0.0.1"
#Port of the Postgres server.
# Default: 5432
# Range: 1 ~ 65535
port = 5432
#An existing database. NeoPlayerSync creates and upgrades its own tables in it.
database = "minecraft"
#A user who can create tables in that database.
user = "minecraft"
#That user's password. It is stored in plain text, so restrict this file and keep it out of shared modpacks.
password = ""
#Refuse a connection that is not encrypted. Turn this off only if the database is on this machine.
require_ssl = true
#Path to the certificate of the authority that signed the database's certificate. Set it to make sure this server talks to your real database. Blank encrypts without that check. Needs require_ssl = true. On Windows, use forward slashes, like C:/certs/ca.crt.
ssl_root_cert = ""
#Name shown in the database as the player's current server. Blank uses this server's port.
server_name = ""
#Move advancements with the player. Use the same value on every server: a server set to false keeps its own copy and leaves the stored one alone. When you turn this on, the first server to save a player decides their advancements, replacing what other servers kept on their own. Needs a restart.
sync_advancements = false
#Move statistics with the player, such as blocks mined and time played. Works like sync_advancements.
sync_statistics = false
